<!doctype html>
<html>
  <body style="font-family: Arial; padding: 20px">
    <h2>Teste Upload Ticket Media</h2>

    <form id="f">
      <label>Token do ticket:</label><br />
      <input name="token" style="width: 320px" required /><br /><br />

      <label>Foto 1:</label><br />
      <input type="file" name="photo1" accept="image/*" /><br /><br />

      <label>Foto 2:</label><br />
      <input type="file" name="photo2" accept="image/*" /><br /><br />

      <label>Foto 3:</label><br />
      <input type="file" name="photo3" accept="image/*" /><br /><br />

      <label>Foto 4:</label><br />
      <input type="file" name="photo4" accept="image/*" /><br /><br />

      <label>Foto 5:</label><br />
      <input type="file" name="photo5" accept="image/*" /><br /><br />

      <label>Vídeo (mp4):</label><br />
      <input type="file" name="video1" accept="video/mp4" /><br /><br />

      <button type="submit">Enviar</button>
    </form>

    <pre id="out" style="margin-top:20px; background:#111; color:#0f0; padding:10px;"></pre>

    <script>
      const ENDPOINT =
        "https://lnfaukysiiflparrciwz.supabase.co/functions/v1/upload-ticket-media";

      document.getElementById("f").addEventListener("submit", async (e) => {
        e.preventDefault();
        const out = document.getElementById("out");
        out.textContent = "Enviando...";

        const fd = new FormData(e.target);

        try {
          const res = await fetch(ENDPOINT, {
            method: "POST",
            body: fd,
          });

          const txt = await res.text();
          out.textContent = "HTTP " + res.status + "\n\n" + txt;
        } catch (err) {
          out.textContent = "Erro:\n" + err;
        }
      });
    </script>
  </body>
</html>
