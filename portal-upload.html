<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Anexar Fotos e Vídeo</title>
  <link rel="stylesheet" href="portal-upload.css" />
</head>
<body>
  <div class="portal-wrap">
    <div class="portal-card">
      <div class="portal-kicker">SGB Serralheria</div>
      <h1>Anexar Fotos e Vídeo</h1>
      <p class="portal-sub">Agora envie até 5 fotos e 1 vídeo explicativo do problema.</p>

      <div id="status" class="status-box"></div>
      <div id="whatsappPlantaoBox" class="whatsapp-plantao-box" style="display:none;margin-bottom:16px;padding:12px;background:#e8f5e9;border-radius:8px;border:1px solid #a5d6a7">
        <div style="font-size:13px;color:#2e7d32;margin-bottom:6px">Atendimento urgente?</div>
        <a id="linkWhatsAppPlantao" href="#" target="_blank" rel="noopener" style="font-weight:700;color:#1b5e20;text-decoration:none">Falar no WhatsApp</a>
      </div>
      <div id="contextoChamado" class="context-box"></div>

      <div class="grid-upload">
        <div>
          <label class="label" for="foto1">Foto 1</label>
          <input class="field file" type="file" id="foto1" accept="image/*,.jpg,.jpeg,.png,.webp,.heic,.heif" />
        </div>
        <div>
          <label class="label" for="foto2">Foto 2</label>
          <input class="field file" type="file" id="foto2" accept="image/*,.jpg,.jpeg,.png,.webp,.heic,.heif" />
        </div>
        <div>
          <label class="label" for="foto3">Foto 3</label>
          <input class="field file" type="file" id="foto3" accept="image/*,.jpg,.jpeg,.png,.webp,.heic,.heif" />
        </div>
        <div>
          <label class="label" for="foto4">Foto 4</label>
          <input class="field file" type="file" id="foto4" accept="image/*,.jpg,.jpeg,.png,.webp,.heic,.heif" />
        </div>
        <div>
          <label class="label" for="foto5">Foto 5</label>
          <input class="field file" type="file" id="foto5" accept="image/*,.jpg,.jpeg,.png,.webp,.heic,.heif" />
        </div>
        <div>
          <label class="label" for="video1">Vídeo</label>
          <input class="field file" type="file" id="video1" accept="video/*,.mov,.mp4,.m4v,.webm,.avi,.qt,.hevc" />
          <div class="muted">iPhone / QuickTime (.MOV) aceito.</div>
        </div>
      </div>

      <button id="btnEnviarMidia" class="btn-primary big">Enviar anexos</button>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="config.js"></script>
  <script src="portal-upload.js"></script>
</body>
</html>
