
<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<title>Envio de Fotos do Chamado</title>
<link rel="stylesheet" href="portal-upload.css">
</head>
<body>
<div class="container">
<h2>Relatar problema</h2>

<label>Nome</label>
<input id="nome">

<label>Telefone</label>
<input id="telefone">

<label>Descrição do problema</label>
<textarea id="descricao"></textarea>

<h3>Fotos</h3>
<input type="file" id="foto1" accept="image/*">
<input type="file" id="foto2" accept="image/*">
<input type="file" id="foto3" accept="image/*">
<input type="file" id="foto4" accept="image/*">
<input type="file" id="foto5" accept="image/*">

<h3>Vídeo</h3>
<input type="file" id="video1" accept="video/*">

<button onclick="enviar()">Enviar</button>
<p id="status"></p>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="config.js"></script>
<script src="portal-upload.js"></script>
</body>
</html>
