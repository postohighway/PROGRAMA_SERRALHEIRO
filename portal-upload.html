<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Anexar Fotos e Vídeo</title>
<link rel="stylesheet" href="./portal-upload.css?v=20260310-1">
</head>
<body>
  <div class="portal-wrap">
    <div class="portal-card">
      <div class="portal-kicker">SGB Serralheria</div>
      <h1>Anexar Fotos e Vídeo</h1>
      <p class="portal-sub">Agora envie até 5 fotos e 1 vídeo explicativo do problema.</p>

      <div class="status-box" id="status"></div>
      <div class="context-box" id="contextoChamado"></div>

      <div class="grid-upload">
        <div>
          <label class="label">Foto 1</label>
          <input type="file" id="foto1" class="field file" accept="image/*">
        </div>
        <div>
          <label class="label">Foto 2</label>
          <input type="file" id="foto2" class="field file" accept="image/*">
        </div>
        <div>
          <label class="label">Foto 3</label>
          <input type="file" id="foto3" class="field file" accept="image/*">
        </div>
        <div>
          <label class="label">Foto 4</label>
          <input type="file" id="foto4" class="field file" accept="image/*">
        </div>
        <div>
          <label class="label">Foto 5</label>
          <input type="file" id="foto5" class="field file" accept="image/*">
        </div>
        <div>
          <label class="label">Vídeo explicativo</label>
          <input type="file" id="video1" class="field file" accept="video/*">
        </div>
      </div>

      <button id="btnEnviarMidia" class="btn-primary big">Enviar anexos</button>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
  <script src="./config.js?v=20260310-1"></script>
  <script src="./config.local.js?v=20260310-1"></script>
  <script src="./portal-upload.js?v=20260310-1"></script>
</body>
</html>
