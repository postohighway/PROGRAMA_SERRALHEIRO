<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Abrir Chamado</title>
<link rel="stylesheet" href="./portal-upload.css">
</head>
<body>
  <div class="portal-wrap">
    <div class="portal-card">
      <div class="portal-kicker">SGB Serralheria</div>
      <h1>Abrir Chamado</h1>
      <p class="portal-sub">Preencha seus dados e descreva o problema. Depois do cadastro, você será levado para a etapa de anexar fotos e vídeo.</p>

      <div class="status-box" id="msgPortal"></div>

      <div id="whatsappPlantaoBox" class="whatsapp-plantao-box" style="display:none;margin-bottom:16px;padding:12px;background:#e8f5e9;border-radius:8px;border:1px solid #a5d6a7">
        <div style="font-size:13px;color:#2e7d32;margin-bottom:6px">Atendimento urgente?</div>
        <a id="linkWhatsAppPlantao" href="#" target="_blank" rel="noopener" style="font-weight:700;color:#1b5e20;text-decoration:none">Falar no WhatsApp</a>
      </div>

      <label class="label">Seu nome</label>
      <input id="clientName" class="field" placeholder="Nome do cliente">

      <label class="label">Telefone</label>
      <input id="clientPhone" class="field" placeholder="Telefone com DDD">

      <label class="label">Descrição do problema</label>
      <textarea id="description" class="textarea" placeholder="Descreva o problema, local e qualquer detalhe importante"></textarea>

      <div id="contratoSection" class="contrato-section">
        <div class="contrato-header">
          <span>Contrato de Prestação de Serviços — Plano Recorrente</span>
          <button type="button" id="btnExpandirContrato" class="btn-ghost-mini" aria-label="Expandir contrato">▼ Ler contrato</button>
        </div>
        <div id="contratoConteudo" class="contrato-conteudo" style="display:none"></div>
        <label class="contrato-aceite">
          <input type="checkbox" id="contratoAceito" required>
          <span>Li e aceito o contrato de prestação de serviços. Sem a assinatura formal do contrato o cliente não será atendido em regime de recorrência.</span>
        </label>
      </div>

      <button id="btnEnviarPortal" class="btn-primary big">Continuar para anexos</button>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
  <script src="./config.js"></script>
  <script src="./config.local.js"></script>
  <script src="./ticket.js"></script>
</body>
</html>
