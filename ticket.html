<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Abrir Chamado</title>
<link rel="stylesheet" href="./portal-upload.css">
</head>
<body>
  <div class="portal-wrap">
    <div class="portal-card">
      <div class="portal-kicker">SGB Serralheria</div>
      <h1>Abrir Chamado</h1>
      <p class="portal-sub">Preencha seus dados e descreva o problema. Depois do cadastro, você será levado para a etapa de anexar fotos e vídeo.</p>

      <div class="status-box" id="msgPortal"></div>

      <label class="label">Seu nome</label>
      <input id="clientName" class="field" placeholder="Nome do cliente">

      <label class="label">Telefone</label>
      <input id="clientPhone" class="field" placeholder="Telefone com DDD">

      <label class="label">Descrição do problema</label>
      <textarea id="description" class="textarea" placeholder="Descreva o problema, local e qualquer detalhe importante"></textarea>

      <button id="btnEnviarPortal" class="btn-primary big">Continuar para anexos</button>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
  <script src="./config.js"></script>
  <script src="./config.local.js"></script>
  <script src="./ticket.js"></script>
</body>
</html>
